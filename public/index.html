<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zigarettenautomaten-Karte</title>
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>🚬 Zigarettenautomaten-Karte</h1>
    <button id="btn-new" class="btn-primary">+ Neuer Automat</button>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="filter-row">
        <label><input type="checkbox" class="filter-status" value="ok" checked /> OK</label>
        <label><input type="checkbox" class="filter-status" value="defekt" checked /> Defekt</label>
        <label><input type="checkbox" class="filter-status" value="ausser_betrieb" checked /> Außer Betrieb</label>
      </div>
      <ul id="machine-list" class="machine-list"></ul>
    </aside>
    <main id="map"></main>
  </div>

  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal">
      <h2 id="modal-title">Automat</h2>
      <form id="machine-form">
        <input type="hidden" id="f-id" />
        <label>Name
          <input type="text" id="f-name" required />
        </label>
        <label>Adresse
          <input type="text" id="f-address" required />
        </label>
        <div class="row">
          <label>Breitengrad (lat)
            <input type="number" step="any" id="f-lat" required />
          </label>
          <label>Längengrad (lng)
            <input type="number" step="any" id="f-lng" required />
          </label>
        </div>
        <p class="hint">Tipp: Klicke auf die Karte, um Koordinaten zu übernehmen.</p>
        <label>Status
          <select id="f-status">
            <option value="ok">OK</option>
            <option value="defekt">Defekt</option>
            <option value="ausser_betrieb">Außer Betrieb</option>
          </select>
        </label>
        <label>Befüllstand: <span id="f-fill-value">100</span>%
          <input type="range" min="0" max="100" id="f-fill" value="100" />
        </label>
        <label>Notizen
          <textarea id="f-notes" rows="2"></textarea>
        </label>
        <div class="modal-actions">
          <button type="button" id="btn-delete" class="btn-danger hidden">Löschen</button>
          <div class="spacer"></div>
          <button type="button" id="btn-cancel">Abbrechen</button>
          <button type="submit" class="btn-primary">Speichern</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
